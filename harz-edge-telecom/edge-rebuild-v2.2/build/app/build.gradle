plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.harz.edgetelecom'
    compileSdk 34
    defaultConfig {
        applicationId 'com.harz.edgetelecom'
        minSdk 26
        targetSdk 34
        versionCode 4          // v2.1.0-fieldready was 3 (lost md5 61c659bc)
        versionName '2.2.0-rebuild1'
    }
    buildTypes {
        debug { }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false }
}
dependencies {
    implementation project(':core')
}
