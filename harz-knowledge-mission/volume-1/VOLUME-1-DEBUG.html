const CRYPTO=window.crypto;let idx=[];
async function sha(s){const b=new TextEncoder().encode(s);const h=await CRYPTO.subtle.digest("SHA-256",b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function render(q){q=q.toLowerCase();const L=DOCS.filter(d=>!q||d.t.toLowerCase().includes(q)||d.x.toLowerCase().includes(q)).slice(0,200);
document.getElementById("count").textContent=q?L.length+" results (top 200 shown) of "+DOCS.length+" docs":DOCS.length+" documents, "+new Set(DOCS.map(d=>d.d)).size+" domains";
document.getElementById("list").innerHTML=L.map((d,i)=>'<div class="doc" onclick="openDoc('+DOCS.indexOf(d)+')"><b>'+d.t.replace(/</g,"&lt;")+'</b>'+d.d+' — '+d.x.length.toLocaleString()+' chars</div>').join("")}
async function openDoc(i){const d=DOCS[i];const s=await sha(d.x);const good=s===d.h;
document.getElementById("viewer").style.display="block";document.getElementById("list").style.display="none";
document.getElementById("vbody").textContent=(good?"[SHA-256 VERIFIED]\n\n":"[INTEGRITY FAILURE - REFUSED]\n\n")+d.x;
if(!good){document.getElementById("banner").className="bad";document.getElementById("banner").textContent="FAIL-CLOSED: document hash mismatch — content refused."}}
function closeDoc(){document.getElementById("viewer").style.display="none";document.getElementById("list").style.display="block"}
async function verifyAll(){let ok=0,bad=0;for(const d of DOCS){if(await sha(d.x)===d.h){ok++}else{bad++}}
const b=document.getElementById("banner");b.className=bad?"bad":"ok";
b.textContent=bad?"FAIL: "+bad+" mismatches of "+DOCS.length+" — volume integrity FAILED.":"PASS: all "+DOCS.length+" documents byte-verified (SHA-256). Offline, no network used."}
document.getElementById("q").addEventListener("input",e=>render(e.target.value));render("");
