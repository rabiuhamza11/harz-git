<script>
const DOCS=[{"d":"businessday.ng","h":"07c7b3daf968edbe0813a89798474880311518717c2cf023d2c7efa478983be9","t":"Why trust is the most valuable currency in fintech — Perkins Ogedengbe","u":"https://businessday.ng/bd-weekender/article/why-trust-is-the-most-valuable-currency-in-fintech-perkins-ogedengbe/","x":"Share Perkins Ogedengbe is a global partnerships, market expansion, and commercial strategy leader with experience scaling platform ecosystems across Africa, Europe, and North America. She specialises in building enterprise partnerships, launching products in regulated markets, and driving platform adoption and revenue growth across emerging economies. With a background in fintech infrastructure, growth strategy, and founder-led operations, she has helped organisations expand into new markets while delivering sustainable commercial growth. In this interview with CHISOM MICHAEL, she discusses building trust in global partnerships, balancing growth with regulatory compliance, scaling fintech across emerging markets, cross-border payments in Africa, AI’s role in financial services, leadership, and the future of financial infrastructure. You have worked across Africa, Europe, and North America. What differences have shaped the way partnerships are built and sustained in these markets? One of the biggest lessons I’ve learned is that while payments are global, trust is still built locally. Across Europe and North America, partnerships are typically built on institutional maturity. The conversations begin with regulatory compliance, operational resilience, cybersecurity, governance and how your infrastructure integrates into existing financial systems. There is an expectation that these foundations already exist, so commercial discussions focus on scale, efficiency and long-term value creation. Across much of Africa, those same principles matter, but the context is different. Financial infrastructure is evolving at different speeds across the continent, regulatory frameworks are becoming increasingly sophisticated, and customer behaviour varies significantly from one market to another. A payment solution that succeeds in East Africa may require an entirely different commercial and regulatory approach in West or Central Africa. What has always impressed me about Africa is its willingness to innovate around infrastructure constraints. Mobile money, agency banking and digital wallets didn’t emerge because they were fashionable; they emerged because they solved real economic problems. Ultimately, sustainable partnerships are not determined by geography but by alignment. Whether you’re working with a financial institution in London, Lagos or Toronto, the same questions eventually arise: Can we trust your infrastructure? Can we rely on your governance? Will this partnership still create value five years from now? Technology may open the first door, but trust is what keeps partnerships alive. Expanding financial infrastructure across regulated markets often comes with operational and policy challenges. What has been the most difficult balance to maintain between growth and compliance? There is often an assumption that growth and compliance sit on opposite sides of the table. I don’t see them that way. The strongest financial institutions recognise that compliance is not simply about satisfying regulators; it is about protecting customers, preserving market confidence and creating sustainable businesses. When you’re expanding across multiple jurisdictions, every market presents a different regulatory philosophy. Some regulators prioritise innovation, others prioritise consumer protection, while others focus heavily on financial stability and anti-money laundering controls. The challenge is building operating models that can accommodate those differences without creating unnecessary complexity for customers. I’ve learned that the organisations which scale most successfully are rarely those that move the fastest. They are the ones that invest early in governance, transaction monitoring, risk management and regulatory engagement. That discipline becomes increasingly important as payments become more instantaneous. Faster settlement should never mean weaker oversight. In many respects, compliance has become a competitive advantage. Financial institutions want partners they can trust, regulators want participants they can supervise confidently, and customers want assurance that their money is secure. Many fintech companies focus on scaling quickly. In your experience, what separates sustainable expansion from short-term market entry? The fintech industry has, understandably, celebrated speed. But speed alone has never been a durable competitive advantage. Market entry is relatively easy. Building relevance is considerably harder. I’ve always believed that expansion should be measured less by the number of countries entered and more by the depth of participation within those markets. That means active merchants, reliable transaction volumes, strong customer retention, healthy unit economics, and trusted local relationships. Before entering any new market, I believe every leadership team should ask three questions. Does this solve a meaningful customer problem? Can we operate within a clear regulatory framework? Do we have the partnerships required to sustain growth once the initial excitement fades? If those questions cannot be answered confidently, expansion often becomes an expensive exercise in geography rather than value creation. Sustainable growth is patient. It requires investment in people, infrastructure, compliance, customer education and local partnerships. The companies that endure are usually not those that launch first; they are the ones that remain relevant long after others have exited. You have led partnerships with banks, PSPs, and enterprise platforms. What qualities do you look for before committing to a long-term strategic partnership? Technology compatibility is important, but it is rarely the deciding factor. The first thing I assess is strategic alignment. Are we solving the same problem, and are we committed to creating value beyond the first commercial agreement? The second is operational discipline. Payments operate on trust, and trust is reflected in settlement performance, system resilience, fraud controls, customer support and transparency during operational incidents. Third is regulatory maturity. Financial services are ultimately a confidence industry. Organisations that invest in governance tend to become stronger long-term partners because they understand that reputation compounds over time. Finally, I pay close attention to leadership. Markets change. Regulations evolve. Technologies become obsolete. Strong leadership determines whether a partnership adapts successfully when those inevitable changes occur. The most successful partnerships I’ve experienced have never been purely commercial relationships. They became shared commitments to solving increasingly complex problems together. They create value not simply because contracts exist, but because both organisations continue investing in the relationship. Cross-border payments remain a major conversation in African fintech. What structural gaps still need to be addressed to improve the movement of money across the continent? When people discuss cross-border payments in Africa, the conversation often centres on speed. In my view, speed is no longer the primary challenge. The more fundamental issue is connectivity between financial systems. Africa is home to 54 countries, more than 40 currencies, multiple regional economic communities, and diverse regulatory frameworks. While domestic payment systems have advanced significantly over the past decade, moving money across borders still involves fragmented settlement infrastructure, correspondent banking dependencies, foreign exchange constraints, and varying compliance requirements. The result is higher costs, slower settlement and increased complexity for businesses operating across the continent. This has real economic implications. According to the World Bank, Sub-Saharan Africa remains one of the most expensive regions globally for remittances, with transfer costs still significantly above the UN Sustainable Development Goal target of 3%. For SMEs and corporates alike, these frictions increase the cost of doing business and limit access to regional markets. This is precisely why the success of the African Continental Free Trade Area will depend not only on reducing tariffs but also on modernising the financial infrastructure that supports trade. A manufacturer in Ghana should be able to pay a supplier in Kenya with the same confidence and efficiency as a domestic transaction. Until payments move as seamlessly as goods and services are expected to, the full economic potential of AfCFTA will remain constrained. Encouragingly, we’re beginning to see progress through initiatives focused on regional payment interoperability and local currency settlement. These developments have the potential to reduce dependence on hard currencies for intra-African trade, improve liquidity efficiency, and shorten settlement cycles. But achieving scale will require sustained collaboration between central banks, regulators, commercial banks, payment providers and policymakers. Ultimately, cross-border payments are not simply about moving money. They are about enabling trade, attracting investment, empowering African businesses to expand beyond national borders and accelerating economic integration. The institutions that will shape the next decade are unlikely to be those processing the highest number of transactions. They will be those building the trusted infrastructure that allows commerce to flow effortlessly across the continent. Your work involves platform ecosystems and merchant adoption. What have you learnt about trust when introducing new financial products into emerging markets? One of the biggest misconceptions in financial services is that customers adopt innovation because it is new. In reality, customers adopt innovation because it reduces uncertainty. Trust is rarely created by advertising or product demonstrations. It is built through consistent execution. For a merchant, trust is remarkably practical. Can I receive my settlement on time? Are transaction failures resolved quickly? Is pricing transparent? If something goes wrong at midnight, will someone respond? Those questions often matter more than the sophistication of the technology itself. This becomes even more important in emerging markets, where many businesses have experienced service interruptions, regulatory changes or inconsistent financial infrastructure. In those environments, reliability becomes a competitive advantage. I’ve also learned that trust extends beyond the customer relationship. Financial products succeed when regulators, banking partners, merchants and technology providers all have confidence in the ecosystem. If one part of that chain loses confidence, adoption slows considerably. Another important lesson is that education should never be underestimated. Launching a new payment product is not simply about deploying technology; it is about helping businesses understand how that technology improves cash flow, operational efficiency and customer experience. Technology creates access, reliability creates confidence, and consistency creates long-term adoption, with those three elements remaining inseparable in payments. You moved from business development into leading global sales and partnerships. How has your leadership approach changed as your responsibilities expanded across multiple regions? Early in my career, success was largely defined by personal performance, winning partnerships, negotiating commercial agreements and delivering revenue growth. Leadership changed my perspective entirely. Today, my role is far less about being the person with the answers and far more about creating an environment where talented people can make good decisions consistently, even when I’m not in the room. As organisations expand across regions, complexity increases exponentially. Different regulatory environments, customer behaviours, cultural expectations and commercial priorities mean that leadership can no longer rely on proximity. It relies on clarity. I’ve become much more intentional about building operating principles rather than directing individual actions. If people understand the purpose behind a decision, they make better decisions independently. Another lesson has been the importance of cross-functional leadership. Payments is one of the few industries where commercial success depends on legal, compliance, product, engineering, finance and operations moving together. Sales can generate demand, but sustainable growth only happens when the entire organisation executes as one. I’ve also learned that leadership becomes less visible as organisations mature. The objective is not to be involved in every decision but to build systems, governance and culture that continue delivering results without constant intervention. Ultimately, leadership is measured less by what you achieve personally and more by the capability you leave behind in the organisation. As a board advisor for a leadership programme focused on AI-driven engagement, how do you see artificial intelligence reshaping leadership and decision-making in fintech? Artificial intelligence is often discussed as a technology story. I believe it is fundamentally a leadership story. The greatest impact of AI will not simply be automation; it will be the quality and speed of decision-making. Financial institutions generate extraordinary amounts of data every second, including payments, customer interactions, fraud signals, liquidity movements and operational metrics. Historically, much of that information has been analysed retrospectively. AI enables leaders to move from hindsight to foresight. Imagine being able to identify emerging fraud patterns before losses occur, predict customer churn before accounts become inactive, optimise liquidity positions in real time, or detect operational bottlenecks before customers notice them. Those capabilities fundamentally change how organisations allocate resources and manage risk. However, the introduction of AI also raises important governance questions. Transparency, explainability, data quality and accountability become increasingly critical as more decisions are supported by machine learning. One principle I hold strongly is that AI should enhance judgment, not replace it. Leadership will continue to require empathy, ethics and accountability qualities that algorithms cannot replicate. The organisations that benefit most from artificial intelligence will not necessarily be those with the most advanced models. They will be those that combine technological capability with strong governance, clear values and responsible leadership. In financial services, trust remains the currency that matters most. AI should strengthen that trust, never compromise it. You have worked closely with founder-led operations and scaling businesses. What lessons have you learned about leadership during periods of rapid growth? One of the most important lessons I’ve learned is that growth amplifies both strengths and weaknesses. What works for a company of twenty people rarely works for an organisation of two hundred, and certainly not for one operating across multiple markets. In the early stages of a business, founders often succeed through speed, intuition and personal involvement. They are close to every customer, every decision and every challenge. But as organisations grow, leadership has to evolve from being the person who solves every problem to building systems that enable others to solve them consistently. That transition is often the most difficult. It requires leaders to become comfortable with delegation, governance and standardisation without losing the entrepreneurial culture that made the business successful in the first place. I’ve also found that rapid growth places enormous pressure on alignment. Revenue may grow quickly, but unless product, compliance, operations, finance and commercial teams are growing together, the organisation eventually reaches a point where complexity begins to outpace execution. Leadership during scale is therefore less about managing growth and more about managing clarity. People perform better when they understand not just what is expected of them, but why those expectations matter. Ultimately, sustainable growth is not measured by how quickly a business expands. It is measured by how well the organisation continues to execute as that complexity increases. Great leadership is about building institutions that can thrive beyond the founders themselves. You advise on women’s leadership programmes while operating at a senior level in fintech infrastructure. What do most leadership conversations still get wrong? I think many leadership conversations still focus too heavily on preparing individuals for leadership and not enough on preparing organisations to benefit from diverse leadership. We often speak about confidence, resilience and personal development, and those are important. But capability has never been the only barrier. Access remains equally significant. Access to strategic projects. Access to executive sponsorship. Access to commercial responsibility. Access to boardrooms where decisions are made. In financial services, careers are often shaped by exposure as much as experience. Leaders grow when they are trusted with complexity, not simply when they attend leadership programmes. Another misconception is that diversity initiatives should be viewed as social programmes rather than business strategy. Organisations with diverse leadership teams are often better positioned to understand different customer segments, challenge conventional thinking and make more balanced decisions in increasingly global markets. For me, leadership has never been about occupying a seat at the table. It is about creating environments where different perspectives improve the quality of decisions. That is particularly important in fintech, where the customers we serve represent different cultures, income levels, geographies and financial behaviours. If leadership does not reflect that diversity of experience, innovation inevitably becomes narrower. The future of leadership is not about creating more leaders who think alike. It is about creating institutions that recognise different perspectives as a competitive advantage. According to your profile, you led a revenue growth of 25% in under 12 months. Walk us through the decision that made it possible, not the outcome itself? People often assume that revenue growth begins with sales. In my experience, it begins with focus. The most important decision we made was to stop thinking about revenue as the objective and start thinking about customer problems as the objective. That may sound simple, but it fundamentally changed how we prioritised opportunities. Rather than pursuing every available market or customer segment, we became more deliberate about where our infrastructure could create the greatest value. We spent more time understanding payment friction, settlement challenges, regulatory requirements and operational pain points before discussing commercial terms. That approach also changed how we worked internally. Sales became more closely aligned with product, compliance, engineering and customer success because solving complex financial problems rarely sits within one department. Equally important was recognising that not all revenue is equal. Sustainable growth comes from customers who continue to transact because the solution has become embedded in their operations, not because they were acquired through aggressive commercial incentives. I’ve always believed that commercial leadership is about making decisions that remain valuable long after quarterly targets have been achieved. Revenue is an outcome of trust, operational excellence and relevance. The decision that drove growth was therefore not a pricing decision or a sales campaign. It was choosing to build relationships around long-term value creation rather than short-term transactions. Looking at the future of fintech across Africa and Europe, what opportunities do you believe are still underestimated by global investors and operators? I believe one of the most underestimated opportunities is the convergence of financial infrastructure across continents. For many years, fintech has been discussed in terms of individual products, payments, lending, wallets or remittances. Increasingly, those categories are becoming interconnected through shared infrastructure, open banking, digital identity, artificial intelligence and real-time payment networks. Africa is particularly well-positioned in this transition because many markets are building modern financial infrastructure without the burden of extensive legacy systems. Combined with one of the world’s youngest and fastest-growing populations, increasing smartphone adoption and expanding digital connectivity, the continent represents an environment where financial innovation can scale rapidly when supported by the right infrastructure. At the same time, Europe brings regulatory maturity, capital markets and deep institutional expertise. The greatest opportunity is therefore not Africa in isolation or Europe in isolation, but the increasing integration between the two. As trade relationships deepen, particularly under initiatives such as the African Continental Free Trade Area, the demand for efficient cross-border payments, embedded financial services, and interoperable digital infrastructure will continue to grow. I also believe investors are beginning to shift their attention from consumer-facing applications to foundational infrastructure. The next generation of value creation is likely to come from businesses that enable financial institutions, enterprises and governments to connect more efficiently rather than simply offering another customer-facing payment experience. Looking ahead, the future of fintech will be defined less by who builds the next app and more by who builds the trusted infrastructure that allows global commerce to move more seamlessly. Those who recognise that shift early will shape the next decade of financial services. Related News Nearpays wins Money20/20 Fintech for Good Award Rank Capital emerges as Nigeria’s 6th fastest-growing fintech Fintechs, IT firms dominate Africa’s fastest-growing companies list Chisom Michael Chisom Michael is a data analyst (audience engagement) and writer at BusinessDay, with diverse experience in the media industry. He holds a BSc in Industrial Physics from Imo State University and an MEng in Computer Science and Technology from Liaoning Univerisity of Technology China. He specialises in listicle writing, profiles and leveraging his skills in audience engagement analysis and data-driven insights to create compelling content that resonates with readers. Share You Might Also Like From Central London to Lagos Central: David Wej Signature SID initiative, gender equality fund champions advocate for stronger collaboration across Malaria, TB and HIV responses Higgins Peters bags Lifetime Grand Patronship of Yala United Forum"},{"d":"businessday.ng","h":"07c7b3daf968edbe0813a89798474880311518717c2cf023d2c7efa478983be9","t":"Why trust is the most valuable currency in fintech — Perkins Ogedengbe","u":"https://businessday.ng/bd-weekender/article/why-trust-is-the-most-valuable-currency-in-fintech-perkins-ogedengbe/","x":"Share Perkins Ogedengbe is a global partnerships, market expansion, and commercial strategy leader with experience scaling platform ecosystems across Africa, Europe, and North America. She specialises in building enterprise partnerships, launching product reating institutions that recognise different perspectives as a competitive advantage. According to your profile, you led a revenue growth of 25% in under 12 months. Walk us through the decision that made it possible, not the outcome itself? People often assume that revenue growth begins with sales. In my experience, it begins with focus. The most important decision we made was to stop thinking about revenue as the objective and start thinking about customer problems as the objective. That may sound simple, but it fundamentally changed how we prioritised opportunities. Rather than pursuing every available market or customer segment, we became more deliberate about where our infrastructure could create the greatest value. We spent more time understanding payment friction, settlement challenges, regulatory requirements and operational pain points before discussing commercial terms. That approach also changed how we worked internally. Sales became more closely aligned with product, compliance, engineering and customer success because solving complex financial problems rarely sits within one department. Equally important was recognising that not all revenue is equal. Sustainable growth comes from customers who continue to transact because the solution has become embedded in their operations, not because they were acquired through aggressive commercial incentives. I’ve always believed that commercial leadership is about making decisions that remain valuable long after quarterly targets have been achieved. Revenue is an outcome of trust, operational excellence and relevance. The decision that drove growth was therefore not a pricing decision or a sales campaign. It was choosing to build relationships around long-term value creation rather than short-term transactions. Looking at the future of fintech across Africa and Europe, what opportunities do you believe are still underestimated by global investors and operators? I believe one of the most underestimated opportunities is the convergence of financial infrastructure across continents. For many years, fintech has been discussed in terms of individual products, payments, lending, wallets or remittances. Increasingly, those categories are becoming interconnected through shared infrastructure, open banking, digital identity, artificial intelligence and real-time payment networks. Africa is particularly well-positioned in this transition because many markets are building modern financial infrastructure without the burden of extensive legacy systems. Combined with one of the world’s youngest and fastest-growing populations, increasing smartphone adoption and expanding digital connectivity, the continent represents an environment where financial innovation can scale rapidly when supported by the right infrastructure. At the same time, Europe brings regulatory maturity, capital markets and deep institutional expertise. The greatest opportunity is therefore not Africa in isolation or Europe in isolation, but the increasing integration between the two. As trade relationships deepen, particularly under initiatives such as the African Continental Free Trade Area, the demand for efficient cross-border payments, embedded financial services, and interoperable digital infrastructure will continue to grow. I also believe investors are beginning to shift their attention from consumer-facing applications to foundational infrastructure. The next generation of value creation is likely to come from businesses that enable financial institutions, enterprises and governments to connect more efficiently rather than simply offering another customer-facing payment experience. Looking ahead, the future of fintech will be defined less by who builds the next app and more by who builds the trusted infrastructure that allows global commerce to move more seamlessly. Those who recognise that shift early will shape the next decade of financial services. Related News Nearpays wins Money20/20 Fintech for Good Award Rank Capital emerges as Nigeria’s 6th fastest-growing fintech Fintechs, IT firms dominate Africa’s fastest-growing companies list Chisom Michael Chisom Michael is a data analyst (audience engagement) and writer at BusinessDay, with diverse experience in the media industry. He holds a BSc in Industrial Physics from Imo State University and an MEng in Computer Science and Technology from Liaoning Univerisity of Technology China. He specialises in listicle writing, profiles and leveraging his skills in audience engagement analysis and data-driven insights to create compelling content that resonates with readers. Share You Might Also Like From Central London to Lagos Central: David Wej Signature SID initiative, gender equality fund champions advocate for stronger collaboration across Malaria, TB and HIV responses Higgins Peters bags Lifetime Grand Patronship of Yala United Forum"},{"d":"businessday.ng","h":"d877d32e918a0dcc0ca98de598e67e537d7ca14b7d7fd8829bc80bb6a9ebadbd","t":"SIFAX controls a significant share of Nigeria’s logistics and transport sector- Afolabi","u":"https://businessday.ng/interview/article/sifax-controls-a-significant-share-of-nigerias-logistics-and-transport-sector-afolabi/","x":"Share The Nigeria’s maritime sector has recorded many giant strides in the last few years. In this interview with TELIAT ABIODUN SULE and CHIJIOKE ONYEOGUBALU, the Group Executive Vice Chairman and Founder of SIFAX Group, DR TAIWO OLAYINKA AFOLABI, one of the nation’s leading wealth creators and employers of labour, identified the challenges of the maritime sector and also explained how SIFAX Group became a leading maritime firm in Nigeria. He further suggested ways on how the full potential of the sector could be tapped. Excerpts: The Nigerian maritime business is governed by several laws. From your perspective as a major stakeholder, what are the laws and policies the FG needs to put in place to make the maritime business environment friendly to operators? As a company, we have always advocated that the maritime sector can be a major earner for the country. The sector has the capacity to contribute more to the GDP in view of the dwindling oil revenue if good policies and laws are put in place. First, there should be a strict implementation of the Cabotage Law. The implementation of this law has not been detailed. If this law is well implemented, many Nigerians and indigenous companies will be involved in several businesses in the maritime sector and this will curb the problem of huge capital flight we currently experience in the industry. The disbursement of the Cabotage Vessel Financing Fund is also key to players in the industry. As of last year, the fund was put at about N44 billion naira. These funds will encourage and help businesses in the maritime sector grow. The government should automate many processes at the ports which are still being done manually. Several agents have to run from one office to the other to sign several documents which delay clearing process and encourage corruption in the system. The Ports & Harbour Bill also needs to be amended to accommodate modern reality. Not having the right industry legislation in place has made Nigeria to lag behind in being a competitive maritime hub in West Africa and beyond. Although the bill has scaled through the second reading at the National Assembly, it needs to be passed as soon as possible. There is a need to deeply entrench the Public Private Partnership (PPP) policies in the sector to realize its full potential. When the government brought in the private sector to take charge of the daily running of the terminals, it has yielded great results in the last eleven years. There are still so many things that government needs to hand off. For example, the provision of scanners at the ports, the management of truck parks, the provision of infrastructures, and many more. There should also be a deliberate step towards reducing the rising port costs and charges. At the Taiwo Afolabi Annual Maritime Conference which was organized in my honour by the Maritime Forum of the University of Lagos, it was revealed that a typical shipping company debit note in Nigeria contains about nine different charges which include – shipping line/agencies charge, container cleaning/maintenance, container deposit, MOWCA charge, NIMASA sea protection levy, MOWCA Fee, freight levy, document release, demurrage charges, NIPOST Stamp Tax and Value Added Tax (VAT), all these are some of the issues that should be worked on to make the sector more friendly and attractive. What are the major challenges of the maritime sector and how did you overcome them? The maritime sector is fraught with many challenges. We are helpless against most of these challenges; we have only tried to find a way around them. The first challenge is the payment of lease fees in dollars. When we took over in 2006, exchange rate was between N121 to N136 but today exchange rate is put at N306 to the dollar. We have through the umbrella body of the terminal operators advocated for the payment of the fees in Naira but these appeals have fallen on deaf ears. So we have to keep pushing ourselves to pay these fees. The dilapidated infrastructures are another challenge facing the sector. There are no good roads in and out of the ports. Transfer and moving of consignments out of the ports take weeks and even months. We have advocated for reconstruction and declaration of a state of emergency on these roads. What we have done to overcome this challenge is to help our numerous clients take their consignments to our off docks for a token fee where they can clear them and transport them easily. As much as possible, few of our subsidiaries also do some palliatives on some portions of roads around Apapa. The absence of scanning machines at the port is also delaying and hindering the movement of consignments out of the ports. We cannot do anything to this challenge except the government accepts our proposal. The Nigerian Customs have to do 100 percent physical examination which takes time and have increased theft at the ports. Items taken out of the containers are never complete when loading it back. We have urged the government to make the provision of scanners for the maritime sector a public-private partnership initiative where each terminal operator provides the scanners and maintain them but those scanners will be operated by the Nigerian Customs. There is this concern that foreign players get the largest chunk of the nation’s maritime business, how best can the FG address this? We are happy that the government has passed the local content bill. This bill was not there when the ports were concessioned which gave some advantages to foreign players. The bill has changed the face of the nation’s maritime sector by encouraging and bringing on board Nigerians who are now participating actively in the industry. As I said earlier, NIMASA, one of the key agencies in Nigeria, needs to make sure the Cabotage Law is strictly enforced. Like we all know that securing funding is usually very easy for the foreign players, we urge that the CVFF be released to the Nigerian maritime players to enhance their productivity. The Nigerian banks are still very reluctant in the provision of supports, especially, credit facilities to players in the industry, particularly the small ones. The industry is huge and has unlimited potential but these opportunities can only be unlocked when financial institutions understand the sector and the important roles they are expected to play in the equation. We at SIFAX Group are a best example of an indigenous company that has grown into a big brand because we had the right investment support that has helped us grow. At first, so many people did not believe that the business will yield results but with the insightful vision of the leadership team of the company, we now compete favourably with the foreign players. How much of the market share of the Nigeria’s maritime business does SIFAX control? SIFAX Group controls a significant share of Nigeria’s logistics and transport sector. There are not many organizations in the country that offer a bouquet of services across the logistics value chain. From port terminal management, shipping, clearing and forwarding, warehousing, haulage, off dock services, stevedoring, aviation ground handling, passenger handling, cargo/mail handling, ramp handling, among others, SIFAX Group is positioned strategically to function as a one-stop multimodal company that delivers complimentary services to the delight of our clients. What that means is that whatever the logistics needs of our clients, whether basic or complex, right from the point of origin to point of delivery locally, we have developed the capacity to attend to such demands. This has given us a lot of leverage with our clients as we take the stress off them. They just signed into our comprehensive package, instead of engaging different agencies and companies to handle different services. This has entrenched our company in the logistics industry as a leading player. To answer your question, SIFAX Group has a large share of the market and the good thing is that we are not even resting on our oars as we are currently reviewing our services and processes to deliver a better value. We are currently recalibrating our vision, mission and corporate strategy to be able to stand far above competition. What is the future outlook for the nation’s maritime business? The future is bright for the maritime sector. We are expecting that very soon deep water seaports will begin to spring up in Nigeria so that large vessels will begin to call at the nation’s waters. Few of them are nearing completion in Lekki and Akwa Ibom. A key area where there is a very positive outlook is in the export business. We are beginning to see a great improvement with various policies of the present government maturing. There is a steady rise in the export of various agricultural produce and this will certainly have an impact on the maritime industry. Investment in port infrastructure will certainly improve the fortune of the industry. There will be better revenue from the sector to the government coffers as businesses flourish again. Better infrastructure and friendly charges will attract businesses back to the industry, especially from neighbouring ports. Once adequate and good infrastructures are put in place, the Apapa and Tin Can ports will begin to surpass its revenue expectations. The unique thing about the maritime sector is that there are so many ancillary businesses that help the sector functions. The sector provides vast windows of business opportunities in several maritime and marine-related activities that offer commensurate returns on investments to potential investors. But the infrastructure and friendly environment must be in place for these businesses to thrive. The range of available business opportunities include, but are not limited to, port and terminal operation, shipping, stevedoring, ship brokerage services, marine insurance, ship supply and ship chandelling. Others are warehouse facility management, haulage and logistics, maritime law consultancy services (Admiralty), advertising and marketing, security and safety services, etc. Where do you see SIFAX in the next five years? We are currently embarking on a corporate restructuring which has culminated in an ambitious five-year strategic business plan. The restructuring code named “Quantum Leap” will focus on the entrenchment of a better work culture and aggressive expansion plan. We are also looking at how to achieve efficiency in our service delivery. Our expansion plan includes exploring port terminal management opportunities both locally and in some African countries. Last year, the company won a competitive concession bid for a port terminal at Warri Port. The terminal was handed to us few months back and we are currently working hard to put the facility in top shape so we could open our doors for business. Our new subsidiary, Ocean & Cargo Terminal Services Limited will operate this new business in Warri. This will certainly increase our throughput and ultimately, in the long run, our revenue base. We have also diversified into the financial services sector. We just birthed a new subsidiary, Sky Capital and Financial Allied International Limited. It is the financial services arm of the Group. It was established as an investment and asset management firm to offer wealth creation opportunities through a unique blend of traditional investment management and alternative investment services. We have also acquired stakes in few banks in Sierra Leone and Gambia. Our hospitality subsidiary, Mac Folly Hospitality, is currently building a 250-bed Marriott Hotel at the heart of Ikeja. It is a multi-billion naira project that will revolutionize hospitality business in the country. This will be completed by the end of 2019 or early 2020. The aviation ground handling subsidiary, SAHCO Plc, which was listed on the Nigerian Stock Exchange few weeks ago, is also expanding to offer bespoke travel and tourism services. With the Quantum Leap project, SIFAX Group, in the next five years, is looking at over 300% growth in revenue, more international expansion, better service delivery and more service offerings. Taiwo Olayinka Afolabi, the Chief Executive Officer (CEO) of SIFAX Group Profile Taiwo Olayinka Afolabi, the Chief Executive Officer (CEO) of SIFAX Group, a multinational conglomerate, was born in Ondo to the family of Chief & Chief (Mrs.) Samson Afolabi. A native of Idokunusi Ijebu in the Ijebu East Local Government Area of Ogun State, he started his educational pursuit at Ansar Ud Deen Primary School, Ondo and thereafter, proceeded to Baptist Grammar School, Ibadan, where he obtained his West African School Certificate (WASC). His quest to attain high level of academic excellence and leadership in advocacy led him to the University of Lagos, where he obtained the degree in Law. He became a member of the noble profession when he was called to the Nigerian Bar by the Body of Benchers on Wednesday, November 4, 2009. He later obtained a Masters degree in International Law and Diplomacy from the same university. He began his professional career with a shipping company, Nigerian Express Agencies Limited, where he distinguished himself and rose to become the Head of Operations. With the zeal of entrepreneurship burning in him, he left the company in 1988 to establish what has now turned to a big conglomerate, SIFAX Group, a business interest with diverse investments in Maritime, Aviation, Haulage, Logistics, Oil & Gas and Hospitality, among others. From a little beginning, the company, which started as a freight forwarding agency in Lagos, Nigeria, currently operates across the world with presence in the United States, United Kingdom, Ghana, Gambia, Sierra Leone, Djibouti, etc. Some of the Group’s subsidiaries include Ports and Cargo Handling Services Limited, concessionaire and operator of the Terminal C, Tin Can Island Ports, Apapa Lagos; SIFAX Off Dock Limited, a bonded terminal operator; SIFAX Stevedoring Limited; SIFAX Haulage & Logistics Limited; SIFAX Marine Services Limited; Skypower Aviation Handling Company Plc, an aviation ground handling company, Sky Capital and Financial Allied International Limited, Mac Folly Hospitality Limited, among others. With about three decades of rich entrepreneurial experience, Dr. Taiwo Afolabi, through the dint of hardwork, foresight, resilience, vision and knack for excellence, has emerged not only as one of the leading business icons in Nigeria, but also reckoned with across the world. No doubt his wealth of experience, organizational prudence and business ingenuity have remained invaluable assets to SIFAX Group, which has become a leading player in the Nigerian economy. The company, alongside its subsidiaries, has generated both direct and indirect employment for thousands of eligible Nigerians. Afolabi is a seasoned maritime consultant and a Fellow of many professional bodies including Nigerian Institute of Financial Management (NIFM), Institute of Freight Forwarders of Nigeria (IFFN), Institute of Directors (IOD), Certified Institute of Shipping (CIS) and the Chartered Institute of Arbitrators of Nigeria. He has attended several maritime and aviation-related trainings both locally and internationally on port operations, aviation ground handling operations and management. Due to his rich experience, Afolabi is a sought-after speaker and facilitator at various industry conferences and mentoring programmes. Aside being renowned for his business acumen, Taiwo Afolabi has also established a reputation as a public-spirited individual. His philanthropic philosophy has driven him to give hope and support to many public causes. The major focus of this philanthropic initiative is education, where many schools, from primary to tertiary level have received immense support and assistance. Few of these interventions include a 1,000 capacity lecture theatre at Ladoke Akintola University, Ogbomosho and an 18-seater Toyota Hiace bus donated to the medical students association of the Obafemi Awolowo University, Ile-Ife, Osun State. As a mark of recognition of his outstanding achievements and invaluable contributions to nation building, he has been conferred with various honorary doctorate degrees by four universities, including Ladoke Akintola University, Ogbomosho, Oyo state, Cornerstone University and Theological Seminary, Jerusalem, Israel and USA, European-American University, Dominica and Commonwealth University, Belize. Dr. Taiwo Afolabi is also a recipient of over thirty individual awards from diverse organizations, including the 2014 Business Person of the Year which was conferred on him by one of Nigeria’s leading newspapers, Daily Sun. The Federal Government has also recognized the great contributions of this Ogun-state born business icon. He is a recipient of the Member of the Order of Niger (MON). The accolades are not restricted to Nigeria alone. He is also the Honorary Consul-General of the Republic of Djibouti in Nigeria. He is a member of the Institute of Directors Nigeria; Ikoyi Club 1938; IBB Golf Club, Abuja; the Building Committee of the Nigerian-British Chamber of Commerce and Industry, amongst many others. Dr. Taiwo Afolabi is a sports lover, who enjoys watching and playing football. He is happily married with children. Related News SIFAX Logistics supports traffic control with equipment to LASTMA SIFAX Logistics expands fleet with 13 new trucks to boost operations Explainer: What to know about airport concession in Nigeria Teliat Sule Teliat Abiodun Sule Assistant Editor, Economy & Markets Share You Might Also Like We have to balance long-term investments with subscribers’ current liquidity needs – Ihechere, MD/CEO, Trustfund Pensions We must produce in Nigeria, satisfy the local market, then export to Africa – Finlab’s CEO ‘We are building a regulatory system that works, and works repeatedly’"},{"d":"dailytrust.com","h":"d5d434ec57c8b88d626f5733a1e24d6685e38fe23ddb78484ab7c542c5f70ff3","t":"Discount: Tinubu copying my subsidy model - Atiku","u":"https://dailytrust.com/","x":"✕ CLOSE\n  Online Special\n  City News\n  Entrepreneurship\n  Environment\n  Factcheck\n  Everything Woman\n  Home Front\n  Islamic Forum\n  Life Xtra\n  Property\n  Travel &amp; Leisure\n  Viewpoint\n  Vox Pop\n  Women In Business\n  Art and Ideas\n  Bookshelf\n  Labour\n  Law\n  Letters\n\n\t\n\n\t \n\t\n\t\n\t\n\t\t\n\n\t\t\t\n\t\t\n\r\n         \r\n        \r\n            \r\n            \n\r\n\r\n\r\n                \n\r\n                    \r\n                    \r\n                    \r\n                    \r\n                    \r\n                    \r\n                    \r\n                    \r\n                    \r\n                \n\r\n\r\n                \r\n\r\n
