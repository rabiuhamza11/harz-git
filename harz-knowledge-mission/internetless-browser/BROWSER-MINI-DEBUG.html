        \t\t\tRegistration Of Trustee\n\t\t\t  \n              \n\n          \n\n          \n            \n\n              \n                20 P.O.W Mafemi Crescent, Utako District, Abuja\n              \n            \n\n            \n\n              \n                700-177-7577\n              \n            \n\n            \n\n              \n                [email protected]\n              \n            \n\n\t\t\t  \n\t\t\t  \n \n\nFollow us on\n\n\t\t\t  \n\t\t\t  \n              \n                    Truck Accident Attorneys\n              \n\t\t\t\t  \n\n\t\t\t\t  Partner Site\n              \n\n          \n\t\t\t\n        \n\n      \n\n      \n\n        \n\n          \n\n            1998 - 2026 Media Trust Limited. All rights reserved."},{"d":"dailytrust.com","h":"dc575b7b398e7a20ba275ce826305769d55eb95493577c87e91a95c3e2976b36","t":"The poison in our plates","u":"https://dailytrust.com/the-poison-in-our-plates","x":"The prevalence of food adulteration and use of chemicals in food, fruits and other consumables is heightening concerns about food safety and raising fears of potential public health crises.\nRecent media reports and social media discussions about chemical applications on yogurt, palm oil, bananas, pawpaw, oranges, watermelons, soy sauce, olive oil, chicken, fish, water and beverages are causing increased anxiety among Nigerians.\nFindings by Weekend Trust across parts of the country show that some farmers, traders and food handlers use chemical substances to reduce post-harvest losses, prevent insect infestation, prolong shelf life or improve the appearance of their products.\nThe concerns have also been fueled by reports of food adulteration involving products, ranging from palm oil and fruit juices to beverages and other consumables.\nThe Director-General of the National Agency for Food and Drug Administration and Control (NAFDAC), Professor Mojisola Adeyeye, recently disclosed that the agency receives more than 200 complaints from Nigerians every month over food adulteration and the application of chemicals to food products entering the market.\nAdeyeye said the agency received 225 calls through its complaint channel in August alone.\n“We received over 200 complaints from Nigerians monthly, In August we received 225 calls through the NAFDAC complaint channel,” she said.\nThe disclosure has heightened concerns among consumers already worried about the safety of food sold in markets, shops and by roadside vendors.\nA few years ago, Daily Trust investigations also revealed widespread use of chemicals on fruits, such as bananas and mangoes, as well as the application of hazardous pesticides to protect stored beans against weevils.\nWhile chemicals have legitimate and regulated uses in agriculture and food production, experts say problems arise when substances are applied directly to food in ways that are not approved when excessive quantities are used or when chemicals intended for other purposes are introduced into the food chain.\nOrange juice controversy\nThe food safety debate became more intense recently after former Vice President Yemi Osinbajo disclosed that a laboratory test had found freshly squeezed orange juice consumed by his wife, Dolapo, unfit for human consumption.\nSpeaking at the Open Day for Gardeners’ Seminar, Osinbajo said his wife had switched from carbonated drinks to freshly squeezed orange juice because she considered it a healthier alternative.\nHe said she later experienced unexplained headaches after consuming some food and drinks and decided to send a sample of the orange juice to a laboratory for testing.\n“The results came back. It showed that the freshly squeezed orange juice was not fit for human consumption,” he said.\nOsinbajo warned that products that appear fresh or natural may not necessarily be safe.\nHe alleged that some farmers and traders use pesticides and other chemicals to protect, preserve or accelerate the ripening of fruits and vegetables.\nHe specifically mentioned calcium carbide, which he said was sometimes used to ripen bananas, mangoes, pawpaw and tomatoes.\nHe also cited substances, including Sniper, phosphite, DDT and brodifacoum, alleging that some had been used at different points in the food supply chain.\nSuch allegations underline the importance of distinguishing between approved agricultural chemicals used according to regulations and substances that are illegally or improperly applied to food.\nCommon chemicals used in food\nOne of the concerns repeatedly raised by consumers and experts is the artificial ripening of fruits with calcium carbide.\nCalcium carbide is sometimes used to hasten the ripening of fruits, such as bananas, mangoes and pawpaw. Experts have warned against its use because industrial-grade calcium carbide may contain impurities that can make its application to food unsafe.\nThe concern is not necessarily about every chemical used in agriculture, but about the misuse of substances, particularly where they are not approved for direct contact with food.\nIn Abuja, Weekend Trust visited the main fruit market at Zuba, along the Abuja-Kaduna expressway, where some traders spoke about how fruits were allegedly treated by some suppliers.\nA fruit dealer who declined to be named for fear of repercussions from market leaders said some suppliers harvest fruits while they are still unripe and transport them over long distances before using chemicals to accelerate ripening.\n“They harvest unripe fruits such as mangoes, bananas, pawpaw and oranges and load them into trucks for supply to Abuja.\n“They put the chemical in cellophane wrappers and place them in baskets. Within a short time, the fruits turn yellow and squishy, although appearing fresh,” he said.\nAnother trader, Sani Ibrahim, who said he was familiar with the practice, described what he believed could help consumers identify artificially ripened bananas.\n“It typically shows black patches within a day after the application of the chemical; and it would be released to the market. It can’t keep its yellowish look, so it would rapidly decay, unlike the one with natural ripening, which would remain fresh and have a more pleasing taste,” he said.\nIbrahim added that the substance was also allegedly used on some oranges, particularly those with thicker skins.\nHe said suppliers of jumbo-sized mangoes from distant locations could also use chemicals because transporting naturally ripe mangoes over long distances could result in spoilage before the fruits reach the market.\nAccording to him, suppliers sometimes purchase unripe mangoes and accelerate their ripening before or during transportation so that the fruits become ready for sale when they arrive in Abuja.\nHowever, the investigation found that the practice was not associated with all types of fruits.\nSources said fruits with very high water content, including watermelon and sweet melon, were generally unsuitable for such treatment because applying chemicals could damage the fruits or cause them to burst.\nAlthough it was not the mango production season when the investigation was conducted, sources said the alleged use of chemicals to accelerate mango ripening would become more visible during the peak supply period.\nThey claimed that traces of substances used in the process could sometimes be found on the ground after the market closed.\nMarket union fights practices\nBut the leadership of the Zuba fruit market union said it had taken steps to stop the use of carbide in the market.\nThe chairman of the traders’ union, Ibrahim Muhammad Talba, said the association had declared zero tolerance for carbide substances.\nHe said any trader or supplier caught violating the rule would face sanctions.\n“Any member or supplying visitor who has been caught violating the law would have his goods seized and be sanctioned from operating in the market for a month.\n“And when caught for the second time, the person would be completely expelled from the market,” he said.\nTalba said the traders had established standard for fruits supplied to the market, adding that suppliers were expected to bring fully grown produce.\n“Supplying low-grade produce to this market could cause the owner to lose, as our traders would not patronise such goods in the first place,” he said.\nHe recalled that carbide was previously sold openly in the market, but said the practice was stopped after discussions with NAFDAC officials.\n“They informed us about the danger of the substance to human beings, and since then, the business was prohibited here,” he added.\nSituation worrisome in Edo\nIn Edo State, the practice of ripening fruits with chemical substances has become a source of concern to residents, who have had to contend with the health effects of such practices.\nAs a result, many people are now avoiding fruits. Those who spoke on the development said they were afraid of becoming victims of the harmful practice.\nA resident, Patrick Johnson, who spoke on the issue, said he had stopped buying most fruits following his experience after consuming banana allegedly ripened with chemical substances.\n“I bought plantain some time ago. After eating it, I started having stomach upset and had to go to the hospital for treatment,” he alleged.\nHe said that following the development, he had stopped buying ripe banana and other fruits because he was not sure which ones had been ripened naturally.\n“Now, I don’t buy ripe banana or plantain. I buy unripe ones and leave them until they ripen naturally. By doing so, I am sure of eating fruits without chemicals,” he said.\nA market woman who identified herself only as Mama Twins said the development was worrisome as it was difficult to find fruits in the market that had not been treated with chemicals.\nThe woman, who sells ogbono in one of the markets in Benin City, lamented that some traders were engaging in the practice in the interest of making money.\n“I was a victim of this harmful practice. I bought pineapple, and when I opened it, it was rotten inside. You can imagine what would have happened if we had eaten it,” she said.\nAnother resident, Mr Ibrahim Yakubu, called on the state government to address the menace, saying it is harmful to Nigerians.\nHe alleged that it was difficult to find ripe fruits without chemicals in the market.\n“I hardly buy fruits in the market now, especially banana, pineapple, pawpaw and orange, among others, because they are full of chemicals. I stopped after I developed a running stomach after drinking orange juice,” he said.\nSpeaking on the development, the president of the Edo Traders Welfare Union, Comrade Lucky Orukpe, said the association frowned at the use of chemical substances to preserve or ripen fruits in the market.\nHe said the association had been sensitising traders across various markets in the state on the effects of such harmful practices on human health.\n“We don’t condone this and other illegal practices in the market, including extortion; and we always hand over anyone caught to security agents for prosecution.\n“For people using chemicals to preserve fruits or induce fruit ripening, it is unacceptable to us.\n“We stop many of such fruits from entering the market once we become aware of them,” he said.\nHe called on the government to partner with the association, saying it already has a task force fighting such practices.\n“We have been sensitising traders on these issues; and we have instructed members to always blow the whistle whenever they notice people using substances to ensure the quick ripening of fruits,” he said.\nHe called on traders to desist from such practices, saying they could lead to kidney and liver problems and other health issues.\nHe said the association had set up a market intervention squad to fight such harmful practices in the market, adding that the government needed to partner with the association to effectively cover the entire market.\nMr Iyamu Osaro Culture, chairman of the Edo State Consumer Protection Committee, said the state government frowned at the development and was working to address the issue.\nHe said the committee had commenced sensitisation to enlighten members of the public on the dangers of ripening fruits with chemical substances and the need to stop the practice in the state.\n“We are holding a town hall meeting with members of the public on September 29, 2026 to further enlighten the people on the matter and highlight the consequences of the practice. We will also explain why they should desist from such harmful practices,” he said.\nHe stressed that enforcement would commence after the town hall meeting, adding that before then, the committee would have carried out extensive sensitisation and no one would be able to claim ignorance when caught.\nHe added that after the sensitisation, a mobile court would be set up to try offenders and institute appropriate punishment for those found culpable.\nKatsina: Chemical-beans fears\nIn Katsina State, food safety concerns extend beyond fruits to beans, particularly the use of chemicals to protect stored grains from weevils and other insects.\nA beans dealer who spoke on condition of anonymity said some farmers and traders applied excessive quantities of pesticide to stored beans, or repeatedly treated the grains to prevent insect infestation and reduce post-harvest losses.\nHe expressed particular concern over the improper use of aluminium phosphide-based fumigants, including products such as Phostoxin.\nAccording to him, such products release highly toxic phosphine gas during fumigation, and therefore, require proper handling and controlled conditions.\nHe warned that the danger was not limited to consumers. He said farmers, traders and members of their families could also be exposed when such chemicals are used in homes or poorly ventilated storage facilities.\nHe said research into cowpea storage practices had documented the misuse and overuse of insecticides, adding that pesticide residues detected in beans had raised concerns about possible risks to consumers.\nAgricultural expert Lawan Bashari said farmers could reduce their dependence on chemical treatments by adopting safer storage technologies.\nHe identified hermetic storage methods, including Purdue Improved Crop Storage (PICS) bags as an alternative.\nAccording to him, PICS bags create an environment that limits oxygen and makes it difficult for insects to survive, thereby reducing the need for repeated chemical treatment.\nThe development is significant because beans is an important source of protein for many Nigerian households, while large quantities are stored and transported across states.\nWhere chemical treatments are improperly applied, experts say the issue becomes a food safety concern because consumers may have no way of knowing what substances were used during storage.\nKatsina sources also raised concerns over the alleged use of calcium carbide to ripen fruits, such as bananas, mangoes and pawpaw.\nHowever, they said the practice did not appear to be as widespread in the state as in some other areas.\nKano traders, farmers adopt different approaches\nIn Kano State, some beans sellers said they had stopped using insecticide powder to preserve beans, citing concerns over the potential dangers and the apprehension of consumers.\nA local beans seller, Abdu Wahab Saleh, said traders like him had adopted alternative preservation methods to control weevils and other insects.\nHe said customers had become increasingly uncomfortable with bags of beans suspected to have been treated with insecticide powder.\n“We have since adopted new methods of preserving beans because of insects. Using powder can be dangerous, so avoid that,” Saleh said.\nHe explained that he usually placed beans inside tightly sealed nylon bags before putting them into sacks.\n“We first tighten the beans inside nylon bags before placing them inside the sack. This way, weevils will not be able to survive because it is airtight,” he explained.\nSaleh said some traders also used dry hot pepper, locally known as barkono inside bags to discourage insects.\nOthers, he said, used plastic containers with tight-fitting lids instead of insecticide powders.\nHe also emphasised the importance of maintaining clean storage facilities.\nAccording to him, stores where grains are kept should be cleaned regularly to reduce the presence of insects.\nWhen he notices weevils in a sack of beans, Saleh said he would sometimes spread the beans on a mat under the sun for several hours.\nHe said the heat would help to drive away or kill the insects.\nAnother beans seller, Sadisu Mamman, said he usually purchased only one or two bags at a time because of the difficulty of preserving beans for long periods.\n“I only keep a bag or two of beans, which I sell in no time to avoid the need for preservation for longer periods,” he said.\nMamman said he was aware that some traders use dangerous chemicals to preserve beans but advised against the practice.\n“If I observe that insects begin to appear, I will take it outside under the sun so that the insects would just find their way out because they cannot survive under sun heat,” he said.\nHis comments illustrate the dilemma facing small-scale traders who must preserve grains for extended periods but may lack access to safer storage facilities and technology.\nExperts warn farmers in Benue\nSimilar concerns were raised in Benue State, where consumers have been warned against food processed or preserved with harmful chemicals.\nReports from the state indicate concerns about the use of substances to preserve farm produce, while dried fish and fruit sellers have also faced allegations of using dangerous chemicals.\nHowever, not all traders accept the allegations.\nA fish seller, Hassana Joshuah, denied using deadly chemicals to keep flies away from her fish.\n“I hear about it, but I have not seen people doing so; maybe not in Benue. I only use vegetable oil to make my fish shine,” she said.\nAn agronomist and seed system specialist, Dr Teryima Iorlamen, warned farmers against the use of harmful chemicals on crops and for preservation of farm produce.\nIorlamen, a lecturer at the Joseph Sarwuan Tarka University, Makurdi, urged farmers and consumers to exercise greater caution over the food they produce, buy and serve their families.\nHe said some traders and farmers resorted to chemicals to force fruits such as mangoes, bananas and pawpaw ripen quickly, while others allegedly use substances to prolong the shelf life of meat and fish.\nHe discouraged farmers and traders from practices that could compromise food safety.\nIorlamen warned that the use of chemicals not approved for food processing could expose consumers to substances capable of harming their health.\nConsumers caught between appearance and safety\nFor consumers, the challenge is that many food safety problems cannot easily be detected by simply looking at the product.\nSome consumers who spoke with Weekend Trust expressed concern over what they described as “silent poison” on their tables.\nMrs Salaudeen, a fruit consumer, said artificially ripened fruits were different from naturally ripened ones in taste and nutritional quality.\n“Artificially ripened fruits are not sweet; and I believe they do not provide the nutrients they are supposed to provide. God, who created bananas and gave them time to ripen naturally, knows what he is doing,” she noted.\nShe urged farmers and sellers to allow fruits ripen naturally rather than prioritising speed and market demand.\nShe expressed particular frustration about artificially ripened pawpaw, saying, “The issue of artificially ripened pawpaw really frustrates me because pawpaw is one of my favourite fruits. They should allow all our fruits to ripen naturally. They are doing it mainly for the market rather than considering public health.”\nAnother consumer, Abdulrazak, said he also preferred naturally ripened fruits. He noted that artificially ripened fruits were often too soft and less sweet than those allowed to mature naturally.\nHe also expressed preference for naturally raised chicken and fish, although such claims about nutritional differences would require scientific evidence before being established as fact.\nFor Christian, a university student, the concern goes beyond taste and appearance.\n“I see eating chemically produced foods as something that might not look harmful but has a higher chance of causing health issues at an older age,” he said.\nHe expressed concern about possible long-term effects on organs, such as the kidney and liver.\nHowever, another consumer offered a different perspective, arguing that the mere presence of a chemical does not automatically make food unsafe if the substance is authorised and used within permitted limits.\n“If chemicals used are authorised, then I see it as edible and healthy for consumption,” he said.\nOther consumers said they relied on smell, taste, texture and appearance when trying to distinguish naturally ripened fruits from treated ones.\nOne respondent said naturally ripened bananas usually had a characteristic aroma, natural sweetness and do not irritate the mouth or throat.\nKebiru similarly said some consumers identified suspicious food through unusual smell, taste, texture or colouring.\nBut experts caution that consumers should not rely solely on such observations because some contaminants and chemical residues cannot be detected by sight, smell or taste.\nOther food products under scrutiny\nThe concerns are not limited to fruits and beans; more consumable goods are now under scrutiny.\nThere have been reports and social media claims involving food products, ranging from palm oil and fish to chicken, beverages, water and other consumables.\nRecently, social media discussions focused on alleged adulteration of palm oil with azo dyes and other contaminants, particularly in some traditionally packaged products sold in open markets.\nThere have also been concerns about the handling of sachet and bottled water.\nEarlier, Weekend Trust findings raised concerns about the activities of some unregulated water producers, including allegations that discarded plastic bottles were washed and refilled with contaminated water.\nThe investigation also found that some operators allegedly used makeshift filtration methods that did not meet acceptable hygiene standards.\nExperts said such practices demonstrated that food safety was not only about chemicals but also about hygiene, contamination, storage, transportation and processing.\nMeat and fish have similarly attracted concerns over alleged chemical preservation.\nSome consumers and experts have raised allegations about the use of formalin to delay spoilage or keep flies away from meat and fish.\nFormalin is a formaldehyde-based solution used for legitimate industrial and laboratory purposes, but its deliberate addition to food is unsafe and inappropriate.\nThe use of pesticides such as “Sniper” directly on food products has also generated concern. Such substances are designed for pest control and are not meant to be applied directly to food in ways that expose consumers to unsafe residues.\n50m food-borne illnesses yearly\nThe scale of Nigeria’s food safety challenge was highlighted in June when the Federal Ministry of Health and Social Welfare disclosed that the country recorded nearly 50 million cases of foodborne illnesses and more than 53,000 deaths annually.\nThe Minister of State for Health and Social Welfare, Iziaq Salako, disclosed the figures in Abuja during the commemoration of the 2026 World Food Safety Day.\nSalako said food safety was not merely a technical or regulatory issue but a national health security and development priority.\nHe warned that millions of Nigerian children were at risk from exposure to contaminated food.\nAccording to him, children under five account for almost 80 per cent of the country’s food borne disease burden.\nThe minister said food borne infections, including Salmonella, E. coli, Campylobacter, Shigella and rotavirus, were linked to a large proportion of diarrhoea illnesses recorded in the country.\nHe also identified chemical pollutants such as lead as emerging public health risks requiring greater attention.\nSalako called for stronger cleanliness standards across the food supply chain, improved traceability, transparency and accurate food labelling.\nHe said improving food safety required joint action by government agencies, producers, farmers, traders, regulators and consumers.\nThe developments across Katsina, Kano, Benue and Abuja reveal a common problem: the food chain is long, fragmented and difficult to monitor at every stage.\nA fruit may be grown in one state, harvested while unripe, transported hundreds of kilometres, treated or stored elsewhere and eventually sold in another state.\nBeans can similarly move through several hands between farmers, aggregators, wholesalers and retailers before reaching consumers.\nDangers are grave, doctors warn\nIn separate chats with Weekend Trust, medical experts warned that deliberate or accidental contamination of food with chemicals not approved for food use could expose consumers to serious health risks, particularly when exposure is repeated over a long period.\nA public health physician, Jegede Grace, said the health implications would depend on the specific chemical involved, the quantity consumed, route of exposure and how frequently an individual is exposed.\nShe stressed that chemicals such as pesticides and other agricultural substances were designed for specific purposes and should not be used directly on food unless their use is expressly permitted and controlled under established food-safety regulations.\n“Chemicals are not inherently harmful simply because they are chemicals. The critical questions are what substance is involved, how it is being used, in what quantity, and whether that use is approved for food production,” she said.\nAccording to her, exposure to excessive levels of certain pesticides or other toxic substances could affect organs, such as the liver and kidneys, while some chemicals may also affect the nervous system or cause acute poisoning.\nShe warned that repeated exposure could be particularly concerning because some toxic substances may accumulate or cause damage over time.\n“The absence of immediate symptoms does not necessarily mean that an exposure is harmless. Some effects may only become apparent after repeated or prolonged exposure,” she explained.\nOn the use of calcium carbide for artificial ripening, the physician said consumers should distinguish between naturally occurring food-ripening processes and the use of industrial chemicals to accelerate ripening.\nShe advised consumers not to rely solely on colour, texture or taste to determine whether a fruit had been chemically treated.\nAnother medical doctor, Ekuwke Godwin, said the greatest concern with the reported use of substances such as pesticides, formaldehyde-containing products or other non-food chemicals was the possibility of exposure to substances that were never intended to be consumed.\n“The gastrointestinal system is the first point of contact when contaminated food is eaten, but the effects of toxic substances are not necessarily restricted to the digestive system,” he said.\nHe explained that some toxic chemicals could be absorbed into the bloodstream and subsequently processed by the liver or eliminated through the kidneys.\n“If the exposure is sufficiently high, a person may develop acute symptoms such as vomiting, abdominal pain, dizziness, difficulty breathing or other signs of poisoning, depending on the substance involved,” he said.\nGodwin, however, cautioned against assuming that every unusual-looking fruit or food product had been chemically treated.\n“There is a need to separate verified cases of contamination from assumptions based only on appearance, smell or taste. Laboratory testing is the reliable way to establish the presence and concentration of a particular chemical,” he advised.\nHe urged consumers who develop unusual symptoms after eating suspected contaminated food to seek medical attention, and where possible, retain information about the product or food consumed to assist health workers in determining the possible cause.\nAnother physician, Rufus Ojo, said food safety should be viewed across the entire production and distribution chain rather than placing the responsibility solely on consumers.\nOjo, a specialist in occupational and environmental health, said farmers, food processors, transporters, traders and regulators all had roles to play in preventing harmful chemical exposure.\n“Farmers need to use agricultural chemicals strictly according to approved instructions, while traders and food handlers must not introduce substances that are not authorised for food preservation or processing,” he warned.\nThe physician said some chemicals had legitimate uses in agriculture or industry but become a public health concern when they are misapplied or used outside their approved purpose.\nHe particularly stressed the importance of observing recommended waiting periods after pesticide application to crops before harvesting, where applicable.\n“An important principle in food safety is that a substance approved for one purpose should not automatically be assumed to be safe for another purpose.\n“A pesticide, disinfectant or industrial chemical should not be used to preserve food simply because it can prevent insects, bacteria or spoilage,” he added.\nHe also supported increased laboratory surveillance of food products, saying regulatory agencies need adequate capacity to detect chemical residues and other contaminants.\n“Consumers cannot be expected to identify every chemical hazard by looking at a fruit or smelling a food product. Surveillance, testing, traceability and enforcement are essential parts of a functional food-safety system,” he said.\nOncologist: Chemical exposure contributes to cancer risk\nAn oncologist, Dr Sadiq Abdullahi, said exposure to certain hazardous chemicals was among the environmental factors that could contribute to cancer risk, although the level of risk depends on the substance and the degree of exposure.\nHe explained that cancer generally developed through a complex interaction of genetic, environmental and lifestyle factors, making it difficult to attribute an individual cancer case to a single food or chemical without evidence.\n“There is a difference between saying that a chemical is capable of increasing cancer risk and saying that a particular person developed cancer because they consumed a particular food. The latter requires evidence of the exposure and other relevant factors,” the oncologist said.\nHe said substances classified as carcinogenic or potentially carcinogenic deserved particular attention when there is a possibility of repeated exposure through food, water or the environment.\n“Where a substance has been identified as carcinogenic, unnecessary exposure should be avoided. The concern becomes greater when people are exposed repeatedly without knowing the type or quantity of the chemical involved,” he added.\nThe oncologist said the public should be particularly cautious about the misuse of chemicals intended for agricultural or industrial purposes, stressing that approval for one application does not mean a substance is safe for use in food.\n“A chemical useful for controlling insects or preserving an industrial product should not automatically be considered safe for food. Its safety depends on the intended use, permitted concentration and conditions of exposure,” he also said.\nHe added that washing fruits and vegetables could reduce some surface contaminants, but it cannot be assumed to remove every chemical residue, particularly where a substance has penetrated the food or where contamination occurred during processing.\n“Washing is an i
