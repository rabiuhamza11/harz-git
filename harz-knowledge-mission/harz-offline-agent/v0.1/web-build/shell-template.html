<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kattau — HARZ Offline Agent</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root { --green:#0a7a3c; --bg:#f6faf7; --card:#ffffff; --ink:#1a2b22; --mut:#5b6f64; --line:#dde7e0; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 20px; display:flex; align-items:center; gap:12px; }
header .logo { width:38px; height:38px; border-radius:9px; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; }
header h1 { font-size:18px; } header .sub { font-size:12px; color:var(--mut); }
main { max-width:720px; margin:0 auto; padding:20px 16px 90px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }
label.status { font-size:13px; color:var(--mut); }
#kitstatus { font-size:13px; margin-top:6px; }
.ask { display:flex; gap:8px; }
.ask input { flex:1; font-size:16px; padding:11px 13px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
.ask button, .btnrow button { background:var(--green); color:#fff; border:none; border-radius:10px; padding:11px 18px; font-size:15px; font-weight:600; cursor:pointer; }
button.ghost { background:#fff; color:var(--green); border:1px solid var(--green); }
#answer { white-space:pre-wrap; font-size:15px; line-height:1.55; }
.verdict { margin-top:10px; font-size:13px; color:var(--mut); white-space:pre-wrap; }
.badge { display:inline-block; font-size:12px; font-weight:700; border-radius:999px; padding:3px 10px; margin-right:6px; }
.badge.pass { background:#e2f5e9; color:#0a7a3c; } .badge.ref { background:#fdf0e5; color:#a05a00; } .badge.known { background:#eaf0fb; color:#2b4a9b; }
.btnrow { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
#receipt { font-size:11px; color:var(--mut); white-space:pre-wrap; overflow:auto; max-height:180px; background:#f2f6f3; border-radius:8px; padding:10px; display:none; }
footer { text-align:center; font-size:12px; color:var(--mut); padding:12px; }
h2 { font-size:15px; margin-bottom:8px; }
</style>
</head>
<body>
<header><div class="logo">K</div><div><h1>Kattau</h1><div class="sub">HARZ offline agent · the small one · v0.2</div></div></header>
<main>
<div class="card">
  <h2>Knowledge kit</h2>
  <label class="status" id="kitstatus">Loading the sealed 5,000-document kit…</label>
</div>
<div class="card">
  <h2>Ask Kattau</h2>
  <div class="ask"><input id="q" placeholder="e.g. Taraba River, or: what is 17x23" autocomplete="off"><button onclick="askGo()">Ask</button></div>
  <div id="answer" style="margin-top:14px;"></div>
  <div class="verdict" id="verdict"></div>
  <div class="btnrow">
    <button class="ghost" onclick="runBattery()">Run frozen battery</button>
    <button class="ghost" onclick="saveReceipt()">Download receipt</button>
  </div>
  <div id="receipt"></div>
</div>
<div class="card">
  <h2>Honest scope</h2>
  <label class="status">Kattau answers from his own kit only. Three outcomes: PASS, REFUSED HONESTLY, KNOWN LIMITATION. No language model runs in this browser; no network call is ever used to answer. The battery runs the frozen 20-case set through the same FTS5 engine (threshold 19/20).</label>
</div>
</main>
<footer>Kattau v0.2 · HARZ ecosystem · offline by design</footer>
<script>__BOOT__</script>
</body>
</html>
