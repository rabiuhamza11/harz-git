<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HARZ Root</title>
<style>
  :root { --bg:#f0f2f5; --card:#ffffff; --ink:#1a2233; --sub:#5b6472; --line:#dfe3ea; --acc:#1a5fb4; --ok:#1a7f37; --err:#c0392b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--ink); width:340px; padding:14px; }
  .brand { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .brand img { width:28px; height:28px; border-radius:6px; }
  .brand h1 { font-size:15px; font-weight:700; }
  .brand .fp { margin-left:auto; font-size:10px; color:var(--sub); }
  .status { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:12px; }
  .status.ok { border-left:4px solid var(--ok); }
  .status.bad { border-left:4px solid var(--err); }
  .row { display:flex; justify-content:space-between; font-size:12px; padding:2px 0; }
  .row .k { color:var(--sub); }
  .row .v { font-family:ui-monospace,monospace; font-size:11px; }
  .go { display:flex; gap:6px; margin-bottom:12px; }
  .go input { flex:1; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:13px; }
  .go button { padding:9px 14px; background:var(--acc); color:#fff; border:none; border-radius:8px; font-weight:600; cursor:pointer; }
  .hint { font-size:10px; color:var(--sub); margin:-8px 0 12px 2px; }
  .sect { font-size:11px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.4px; margin:10px 0 6px; }
  .names { max-height:190px; overflow-y:auto; }
  .name { display:flex; align-items:center; gap:6px; padding:5px 8px; background:var(--card); border:1px solid var(--line); border-radius:8px; margin-bottom:4px; cursor:pointer; }
  .name:hover { border-color:var(--acc); }
  .name .n { font-family:ui-monospace,monospace; font-size:12px; font-weight:600; }
  .name .tag { margin-left:auto; font-size:9px; padding:1px 6px; border-radius:99px; background:#e8ebf1; color:var(--sub); }
  .tag.live { background:#e3f4e9; color:var(--ok); }
  .tag.reserved { background:#fdf0d5; color:#8a6d1a; }
  .foot { margin-top:12px; font-size:10px; color:var(--sub); text-align:center; }
  .refresh { font-size:10px; color:var(--acc); cursor:pointer; background:none; border:none; padding:0; }
</style>
</head>
<body>
  <div class="brand">
    <img src="icons/icon48.png" alt="">
    <h1>HARZ Root</h1>
    <span class="fp" id="fp"></span>
  </div>
  <div class="status" id="status"><div class="row"><span class="k">Loading zone…</span></div></div>
  <div class="go">
    <input id="q" placeholder="name.harz — e.g. super.harz" spellcheck="false">
    <button id="open">Go</button>
  </div>
  <div class="hint">Press Enter or Go — opens in this browser via the sovereign zone.</div>
  <div class="sect">Canonical names</div>
  <div class="names" id="names"></div>
  <div class="foot">HARZ ROOT — sovereign namespace · fails closed on zone drift · <button class="refresh" id="refresh">refresh zone</button></div>
<script src="popup.js"></script>
</body>
</html>
