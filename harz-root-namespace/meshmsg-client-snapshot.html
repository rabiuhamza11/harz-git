<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HARZ Messenger</title><meta name="theme-color" content="#ffffff"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f7fa;--panel:#ffffff;--line:#e4e9f0;--txt:#16202b;--mut:#6b7a8c;--acc:#1266f1;--acc2:#e8f0fe}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);height:100dvh;display:flex;flex-direction:column}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px}
header .logo{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px}
header h1{font-size:17px;font-weight:700}
header .sub{font-size:11px;color:var(--mut)}
header .spacer{flex:1}
.badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px}
.badge.on{background:#e6f6ea;color:#157347}.badge.off{background:#fdeaea;color:#c0392b}.badge.pend{background:#fff3cd;color:#9a6700}
#offline{display:none;background:#fff3cd;color:#7a5b00;font-size:12px;padding:6px 16px;text-align:center}
main{flex:1;display:flex;overflow:hidden;max-width:900px;width:100%;margin:0 auto;background:var(--bg)}
#contacts{width:32%;min-width:130px;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto}
#contacts .c{padding:12px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
#contacts .c.active{background:var(--acc2);font-weight:700}
#contacts .c small{display:block;color:var(--mut);font-size:11px}
#chatwrap{flex:1;display:flex;flex-direction:column;min-width:0}
#chathead{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:78%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.45;word-wrap:break-word;position:relative}
.m.me{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.m.them{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.m .t{display:block;font-size:9.5px;opacity:.75;margin-top:4px}
.m .pend{color:#ffe08a;font-weight:700}
#compose{display:flex;gap:8px;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line)}
#compose input{flex:1;border:1px solid var(--line);border-radius:99px;padding:11px 16px;font-size:14px;background:var(--bg);color:var(--txt);outline:none}
#compose button{background:var(--acc);color:#fff;border:none;border-radius:99px;padding:0 20px;font-size:14px;font-weight:700}
#reg{margin:auto;max-width:330px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center;width:92%}
#reg .logo{width:64px;height:64px;border-radius:16px;background:var(--acc);color:#fff;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
#reg h2{font-size:18px;margin-bottom:4px}
#reg p{font-size:12px;color:var(--mut);margin-bottom:16px}
#reg input{width:100%;border:1px solid var(--line);border-radius:99px;padding:12px 16px;font-size:15px;margin-bottom:12px;text-align:center;background:var(--bg);color:var(--txt);outline:none}
#reg button{width:100%;background:var(--acc);color:#fff;border:none;border-radius:99px;padding:13px;font-size:15px;font-weight:700}
#reg .note{font-size:10.5px;color:var(--mut);margin-top:14px;line-height:1.5}
.hide{display:none!important}
@media(max-width:640px){#contacts{width:38%}.m{max-width:85%}}
</style></head><body>
<div id="reg"><div class="logo">H</div><h2>HARZ Messenger</h2><p>Messages that travel without airtime.</p>
<input id="rname" placeholder="Your name" maxlength="24" autocomplete="off">
<button id="rgo">Create my HARZ address</button>
<div class="note">HARZ messages store on your phone and forward when the mesh is reachable — no airtime needed to write.</div></div>
<div id="app" class="hide">
<header><div class="logo">H</div><div><h1 id="uname">—</h1><div class="sub" id="usub">HARZ address: …</div></div><div class="spacer"></div><span class="badge" id="net">…</span><span class="badge pend hide" id="pend">0 pending</span></header>
<div id="offline">Offline — your messages are stored and will forward automatically.</div>
<main><div id="contacts"></div>
<div id="chatwrap"><div id="chathead">Pick a contact</div><div id="msgs"></div>
<div id="compose"><input id="body" placeholder="Write a HARZ message…" autocomplete="off"><button id="send">Send</button></div></div></main></div>
<script>
let ME=JSON.parse(localStorage.getItem('hm_me')||'null');
let OUT=JSON.parse(localStorage.getItem('hm_out')||'[]');
let MSG=JSON.parse(localStorage.getItem('hm_msgs')||'{}');
let lastTs=Number(localStorage.getItem('hm_lasts')||0);
let peer=null;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('hm_out',J(OUT));localStorage.setItem('hm_msgs',J(MSG));localStorage.setItem('hm_lasts',lastTs);}
function netUpd(){const on=navigator.onLine;$('net').textContent=on?'mesh reachable':'offline';$('net').className='badge '+(on?'on':'off');$('offline').style.display=on?'none':'block';}
addEventListener('online',()=>{netUpd();syncNow();});addEventListener('offline',netUpd);
async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?J(body):undefined});return r.json();}
async function syncNow(){
 if(!ME||!navigator.onLine)return;
 const res=await api('sync',{user_id:ME.id,token:ME.token,outbox:OUT.filter(m=>!m.done),since:lastTs}).catch(()=>null);
 if(!res||!res.ok)return;
 for(const d of (res.delivered||[])){const m=OUT.find(x=>x.uuid===d);if(m){m.done=true;const c=MSG[m.to]||[];const loc=c.find(x=>x.uuid===d);if(loc)loc.pending=false;}}
 OUT=OUT.filter(m=>!m.done);
 for(const im of (res.inbox||[])){const nm={uuid:im.uuid,from:im.sender,body:im.body,ts:im.ts,pending:false};const c=MSG[nm.from]||(MSG[nm.from]=[]);if(!c.some(x=>x.uuid===nm.uuid)){c.push(nm);}if(nm.ts>lastTs)lastTs=nm.ts;}
 if(res.now&&res.now>lastTs)lastTs=res.now;
 save();renderMsgs();
}
setInterval(syncNow,4000);
async function loadContacts(){const r=await api('users').catch(()=>null);if(!r||!r.ok)return;const box=$('contacts');box.innerHTML='';
 r.users.filter(u=>u.id!==ME.id).forEach(u=>{const d=document.createElement('div');d.className='c'+(peer===u.id?' active':'');
 d.innerHTML=u.name+'<small>'+u.id+'</small>';d.onclick=()=>{peer=u.id;$('chathead').textContent=u.name;d.parentElement.querySelectorAll('.c').forEach(x=>x.className='c');d.className='c active';renderMsgs();$('body').focus();};box.appendChild(d);});}
function renderMsgs(){$('pend').classList.toggle('hide',OUT.filter(m=>!m.done).length===0);$('pend').textContent=OUT.filter(m=>!m.done).length+' pending';
 if(!peer)return;const c=MSG[peer]||[];c.sort((a,b)=>a.ts-b.ts);const box=$('msgs');box.innerHTML='';
 c.forEach(m=>{const d=document.createElement('div');d.className='m '+(m.from===ME.id?'me':'them');
 const t=new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 d.innerHTML=esc(m.body)+'<span class="t">'+t+(m.pending?' · <span class=pend>pending →</span>':'')+'</span>';box.appendChild(d);});
 box.scrollTop=box.scrollHeight;}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
$('send').onclick=sendMsg;$('body').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});
function sendMsg(){const txt=$('body').value.trim();if(!txt||!peer)return;$('body').value='';
 const m={uuid:(crypto.randomUUID?crypto.randomUUID():'u'+Date.now()+Math.random()),to:peer,body:txt,ts:Date.now(),from:ME.id,pending:true};
 OUT.push(m);(MSG[peer]||(MSG[peer]=[])).push(m);save();renderMsgs();syncNow();}
$('rgo').onclick=async()=>{const name=$('rname').value.trim();if(!name)return;$('rgo').textContent='Creating…';
 const r=await api('register',{name}).catch(()=>null);
 if(!r||!r.ok){$('rgo').textContent='Create my HARZ address';alert(r&&r.error||'Could not reach the mesh.');return;}
 ME={id:r.user_id,token:r.token,name:r.name};localStorage.setItem('hm_me',J(ME));
 $('reg').classList.add('hide');$('app').classList.remove('hide');$('uname').textContent=ME.name;$('usub').textContent='HARZ address: '+ME.id;
 loadContacts();syncNow();setInterval(loadContacts,10000);};
if(ME){$('reg').classList.add('hide');$('app').classList.remove('hide');$('uname').textContent=ME.name;$('usub').textContent='HARZ address: '+ME.id;loadContacts();syncNow();setInterval(loadContacts,10000);}
netUpd();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
