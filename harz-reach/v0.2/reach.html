<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f0f2f5">
<title>HARZ Reach</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#f0f2f5;color:#1a1a2e;padding:16px;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:14px;margin-bottom:10px}
h1{font-size:18px;color:#0b5fff;font-weight:800;margin-bottom:2px}
.sub{font-size:11px;color:#666;margin-bottom:10px}
.code{font-family:monospace;background:#f6f8fa;border:1px solid #e0e0e0;border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;word-break:break-all;margin:8px 0}
.big{font-size:15px;font-weight:700}
.ok{color:#0a7d33;font-weight:700}
.err{color:#b3261e;font-weight:700}
.small{font-size:11px;color:#666}
a{color:#0b5fff}
.btn{display:block;background:#0b5fff;color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;text-align:center;text-decoration:none;margin-top:10px}
.receipt{font-size:11px;color:#666;border-top:1px dashed #d0d5dd;margin-top:10px;padding-top:8px}
</style>
</head>
<body>
<div class="card" id="main">
<h1>HARZ Reach</h1>
<div class="sub">the .harz doorway — signed root, verified locally</div>
<div id="status" class="code">loading the signed book…</div>
</div>
<div class="card small" id="foot"></div>
<script type="module" src="reach.js"></script>
</body>
</html>
